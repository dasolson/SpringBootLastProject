name: Deploy to Ubuntu Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # JDK 17 설정
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # gradlew 권한 설정
      - name: Set gradlew permissions
        run: chmod +x ./gradlew

      # gradle 빌드
      - name: Build with Gradle
        run: ./gradlew clean build

      # DockerHub 로그인
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      # Docker 이미지 빌드 & 푸시
      - name: Build and Push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-app:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-app:latest

      # SSH 키 등록
      - name: Add SSH Key
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SERVER_SSH_KEY }}

      # known_hosts 등록
      - name: Add known_hosts
        run: ssh-keyscan -H 15.164.103.87 >> ~/.ssh/known_hosts

      # 서버 배포
      - name: Deploy on Server using DockerHub image
        run: |
          ssh ubuntu@15.164.103.87 << 'EOF'
            docker stop spring-app || true
            docker rm spring-app || true
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-app:latest
            docker run -d --name spring-app -p 8080:8080 ${{ secrets.DOCKERHUB_USERNAME }}/spring-boot-app:latest
          EOF
